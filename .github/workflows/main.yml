name: Crypto Radar V5

on: schedule: - cron: "0 6-20 * * *" workflow_dispatch:

jobs: run-bot: runs-on: ubuntu-latest

steps:
  - name: Kodu indir
    uses: actions/checkout@v4

  - name: Python kur
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Telegram kutuphanesini kur
    run: |
      pip install python-telegram-bot

  - name: Botu calistir
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    run: |
      python bot-v5kopya.py
